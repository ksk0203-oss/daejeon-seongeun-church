<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청년부 주보 · 2026</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  #hero{ background-image: linear-gradient(165deg, rgba(16,27,50,.1) 0%, rgba(16,27,50,.1) 100%); }
  .cta-row{
    display: flex; gap: 12px; justify-content: center; margin-top: 26px; flex-wrap: wrap;
  }
  .btn{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600;
    padding: 11px 20px; border-radius: 999px;
    text-decoration: none;
    transition: transform .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn-primary{ background: var(--dawn); color: #fff; }
  .btn-ghost{ background: rgba(247,244,238,.1); color: #F4EEE2; border: 1px solid rgba(247,244,238,.3); }
  .latest-label{
    text-align: center; font-size: 12.5px; color: var(--ink-soft);
    letter-spacing: .06em; margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero with-photo" id="hero">
    <div class="hero-inner">
      <div class="eyebrow"><span class="dot"></span>YOUNG ADULTS BULLETIN</div>
      <p class="year">2026</p>
      <h1>청년부 주보</h1>
      <p class="sub">대전성은교회 청년부 · 주일마다 함께 쌓아가는 예배의 기록</p>
      <div class="cta-row">
        <a class="btn btn-primary" id="latest-link" href="posts/detail.html">이번 주 주보 보기</a>
        <a class="btn btn-ghost" href="archive.html">전체 목록 보기</a>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="num">Ⅰ</span>
      <h2>최근 주보 <span class="head-en">Latest</span></h2>
      <span class="rule"></span>
    </div>
    <div id="latest-preview">
      <div class="state-msg">불러오는 중…</div>
    </div>
  </div>

  <div class="footer">
    <p class="verse">"두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라"<br><span class="verse-ref">마태복음 18:20</span></p>
  </div>

  <div class="vision">
    <div class="vision-title">청년 비전 선언문</div>
    <ul class="vision-list">
      <li>말씀으로 세상을 살아내는 제자 공동체</li>
      <li>함께 성장하며 세상을 섬기는 공동체</li>
      <li>다음 세대를 변화시키는 선교적 공동체</li>
    </ul>
  </div>

  <div class="footer" style="padding-top:34px;">
    <p class="church">대전성은교회 청년부 · Daejeon Sungeun Church</p>
  </div>

</div>

<script src="assets/hero-bg.js"></script>
<script>
(function(){
  var hero = document.getElementById('hero');
  if (window.HERO_BG_DATA_URI) {
    hero.style.backgroundImage =
      "url('" + window.HERO_BG_DATA_URI + "')," +
      "linear-gradient(165deg, #101B32 0%, #1B2A4A 55%, #2C3F63 100%)";
  }

  fetch('data/posts.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var posts = (data.posts || []).slice().sort(function(a,b){
        return b.id.localeCompare(a.id);
      });
      var latest = posts[0];
      var preview = document.getElementById('latest-preview');
      if (!latest) {
        preview.innerHTML = '<div class="state-msg">등록된 주보가 아직 없습니다.</div>';
        return;
      }
      document.getElementById('latest-link').href = 'posts/detail.html?id=' + latest.id;
      preview.innerHTML =
        '<a class="archive-item is-latest" href="posts/detail.html?id=' + latest.id + '">' +
          '<div class="archive-left">' +
            '<span class="archive-date">' + latest.date + '</span>' +
            '<span class="archive-week">' + (latest.week || '') + '</span>' +
          '</div>' +
          '<span class="archive-badge">최신</span>' +
        '</a>';
    })
    .catch(function(){
      document.getElementById('latest-preview').innerHTML =
        '<div class="state-msg">주보 데이터를 불러오지 못했습니다.</div>';
    });
})();
</script>
</body>
</html>
