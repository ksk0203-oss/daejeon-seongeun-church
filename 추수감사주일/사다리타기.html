<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사다리 타기</title>
<meta name="description" content="11개 팀 사다리 타기 — 부전승 5팀, 시합 3경기(2팀씩)">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --bg:#F6EFE4; --card:#FFFBF4; --brown:#3D1C0C; --text:#363636; --muted:#7A6A5C;
  --line:rgba(61,28,12,.13); --rail:#D9C9AE;
  --bye:#57613D; --m1:#C2542B; --m2:#2C6E7F; --m3:#A9781E;
  --font:-apple-system, BlinkMacSystemFont, "Pretendard", "Pretendard Variable", "Malgun Gothic", "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); font-size:17px; line-height:1.9; color:var(--text);
  word-break:keep-all; overflow-wrap:break-word;
  background:
    radial-gradient(900px 480px at 85% -8%, rgba(194,84,43,.10), transparent 60%),
    radial-gradient(700px 420px at -5% 4%, rgba(87,97,61,.10), transparent 60%),
    var(--bg);
  min-height:100vh;
}
.wrap{max-width:980px; margin:0 auto; padding:max(28px,env(safe-area-inset-top)) 20px 64px}
header.hero{padding:18px 4px 8px}
.eyebrow{display:inline-block; font-size:15px; font-weight:600; letter-spacing:.14em; color:var(--m1); line-height:1.6}
h1{margin:4px 0 6px; font-size:clamp(38px,7vw,58px); line-height:1.15; letter-spacing:-.02em; color:var(--brown); font-weight:800}
.sub{margin:0; color:var(--muted); font-size:18px; line-height:1.8}
.legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0; padding:0; list-style:none}
.legend li{display:inline-flex; align-items:center; gap:8px; padding:4px 14px 4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:16px; line-height:1.7; font-weight:600; color:var(--text)}
.legend i{width:11px; height:11px; border-radius:50%; background:var(--c)}

.card{background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 12px 34px -18px rgba(61,28,12,.28)}
.ladder-card{margin-top:22px; padding:18px 8px 12px}
.bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 14px; padding:0 14px 8px}
.hint{margin:0; font-size:16px; line-height:1.8; color:var(--muted); flex:1 1 280px}
#prog{font-weight:700; color:var(--brown); white-space:nowrap}
.ladder-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 6px}
#lad{display:block; width:100%; height:auto; margin:0 auto; max-width:860px}
.map{display:flex; flex-wrap:wrap; gap:4px 14px; padding:0 14px 8px; font-size:15px; line-height:1.8; color:var(--muted)}
.map:empty{display:none}
.map b{font-weight:800}
.team .hit{fill:rgba(0,0,0,0)}

.rail,.rung{stroke:var(--rail); stroke-width:4; stroke-linecap:round}
.trace{fill:none; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; opacity:.93}
.team{cursor:pointer; outline:none}
.team circle{fill:var(--card); stroke:var(--brown); stroke-width:2.2; transition:fill .25s, stroke .25s, transform .2s; transform-box:fill-box; transform-origin:center}
.team:hover circle,.team:focus-visible circle{transform:scale(1.1); stroke:var(--c); stroke-width:3.2}
.team .num{font-size:16px; font-weight:800; text-anchor:middle; dominant-baseline:central; fill:var(--brown); pointer-events:none}
.team .nm{font-size:13px; font-weight:700; text-anchor:middle; fill:var(--text); pointer-events:none}
.team.done{cursor:default}
.team.done circle{fill:var(--c); stroke:var(--c); transform:none}
.team.done .num{fill:#fff}
.slot rect{fill:var(--card); stroke:#CDBBA0; stroke-width:2; stroke-dasharray:5 4}
.slot text{text-anchor:middle; dominant-baseline:central; font-weight:800; font-size:16px; fill:#B3A18A; pointer-events:none}
.slot .who{font-size:13px; font-weight:700; fill:var(--text); dominant-baseline:auto}
.slot.done rect{fill:var(--c); stroke:none; stroke-dasharray:none}
.slot.done text{fill:#fff}
.slot.done text.who{fill:var(--text)}
.slot.pop rect{transform-box:fill-box; transform-origin:center; animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.slot{transform-box:fill-box; transform-origin:center}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
#dot{filter:drop-shadow(0 2px 3px rgba(61,28,12,.35)); stroke:#fff; stroke-width:3}

.actions{display:flex; flex-wrap:wrap; gap:10px; padding:10px 14px 6px}
button{font:inherit; font-size:16px; font-weight:700; line-height:1.4; padding:11px 20px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--brown); cursor:pointer; transition:transform .15s, background .2s, box-shadow .2s; -webkit-tap-highlight-color:transparent}
button:hover{background:#fff; box-shadow:0 6px 16px -10px rgba(61,28,12,.5)}
button:active{transform:scale(.97)}
button.primary{background:var(--brown); color:#fff; border-color:var(--brown)}
button.primary:hover{background:#51260F}
button:focus-visible,.team:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid rgba(194,84,43,.45); outline-offset:2px}

h2{margin:36px 4px 14px; font-size:26px; line-height:1.4; color:var(--brown); letter-spacing:-.01em}
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:16px}
.res{padding:18px 20px 20px; position:relative; overflow:hidden}
.res::before{content:""; position:absolute; left:0; right:0; top:0; height:6px; background:var(--c)}
.res header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:4px}
.res h3{margin:0; font-size:22px; line-height:1.5; color:var(--c); font-weight:800}
.res header span{font-size:15px; color:var(--muted); line-height:1.6}
.res ul{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chip{display:inline-flex; align-items:center; gap:8px; padding:3px 14px 3px 10px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:17px; font-weight:700; line-height:1.7; color:var(--text)}
.chip i{width:10px; height:10px; border-radius:50%; background:var(--t)}
.chip.empty{background:transparent; border:1.5px dashed #CDBBA0; color:#B3A18A; padding:3px 18px}
.vs{font-size:13px; font-weight:800; letter-spacing:.1em; color:var(--muted)}
.res.match ul{flex-direction:column; align-items:flex-start; gap:2px}
#doneMsg{margin:18px 4px 0; font-size:17px; font-weight:700; color:var(--bye); min-height:1.9em}

details.names{margin-top:30px; padding:6px 20px 8px}
summary{cursor:pointer; font-weight:700; font-size:18px; color:var(--brown); padding:10px 0; list-style:none; display:flex; align-items:center; justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋"; color:var(--m1); font-weight:800}
details[open] summary::after{content:"－"}
.name-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:4px 0 14px}
.name-grid label{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--muted); font-weight:700}
.name-grid input{flex:1; min-width:0; font:inherit; font-size:16px; padding:8px 12px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--text)}
.note{margin:26px 4px 0; font-size:15px; line-height:1.9; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:max(28px,env(safe-area-inset-bottom)); transform:translate(-50%,20px); opacity:0; background:var(--brown); color:#fff; padding:10px 20px; border-radius:999px; font-size:16px; font-weight:600; transition:.3s; pointer-events:none}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-width:560px){.wrap{padding-left:14px; padding-right:14px} .ladder-card{padding-left:2px; padding-right:2px} h2{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">추수감사주일 윷놀이대회</span>
    <h1>사다리 타기</h1>
    <p class="sub">11개 팀 중 5팀은 부전승, 나머지 6팀은 2팀씩 3개의 시합으로 묶입니다.</p>
    <ul class="legend" aria-label="결과 종류">
      <li style="--c:var(--bye)"><i></i>부전승 5팀</li>
      <li style="--c:var(--m1)"><i></i>시합1 · 2팀</li>
      <li style="--c:var(--m2)"><i></i>시합2 · 2팀</li>
      <li style="--c:var(--m3)"><i></i>시합3 · 2팀</li>
    </ul>
  </header>

  <section class="card ladder-card" aria-label="사다리">
    <div class="bar">
      <p class="hint">팀 번호를 눌러 사다리를 타 보세요. 선을 따라 내려가 도착한 칸에서 결과가 열립니다.</p>
      <span id="prog" aria-live="polite"></span>
    </div>
    <div class="map" id="teamMap"></div>
    <div class="ladder-wrap"><svg id="lad" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="사다리 그림"></svg></div>
    <div class="actions">
      <button type="button" id="all" class="primary">전체 결과 한번에 보기</button>
      <button type="button" id="reset">새 사다리 만들기</button>
      <button type="button" id="copy">결과 복사</button>
    </div>
  </section>

  <h2>대진 결과</h2>
  <section class="board" id="board" aria-live="polite"></section>
  <p id="doneMsg"></p>

  <details class="card names">
    <summary>팀 이름 바꾸기</summary>
    <div class="name-grid" id="nameGrid"></div>
  </details>

  <p class="note">사다리는 이 기기에서 무작위로 만들어져 이 기기에만 저장됩니다. 새로고침해도 결과는 그대로이지만, 다른 기기에서는 다른 사다리가 나오니 한 화면에서 진행해 주세요.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const N = 11, L = 15, STORE = "sadari-2026-v2";
  let G = {};
  function setGeo() {
    const w = (document.querySelector(".ladder-wrap") || {}).clientWidth || 900;
    if (w >= 620) {
      G = { compact: false, COL: 68, PADX: 44, TOP: 112, STEP: 36, GAP: 30, R: 21, CY: 46, NUMFS: 16, SW: 60, SH: 46, TAIL: 34 };
    } else {
      const PADX = 18, COL = Math.max(24, Math.floor((w - 12 - 2 * PADX) / (N - 1)));
      G = { compact: true, COL, PADX, TOP: 58, STEP: 34, GAP: 22, R: Math.min(13, Math.floor(COL / 2) - 1), CY: 24, NUMFS: 12, SW: COL - 4, SH: 44, TAIL: 26 };
    }
    G.LAD_H = L * G.STEP;
    G.W = G.PADX * 2 + (N - 1) * G.COL;
    G.H = G.TOP + G.LAD_H + G.GAP + G.SH + G.TAIL;
  }
  const NS = "http://www.w3.org/2000/svg";
  const LABELS = { bye: "부전승", m1: "시합1", m2: "시합2", m3: "시합3" };
  const LC = { bye: "#57613D", m1: "#C2542B", m2: "#2C6E7F", m3: "#A9781E" };
  const COLORS = ["#C2542B","#2C6E7F","#A9781E","#6B4C9A","#57613D","#B23A48","#1F4E79","#8C6A43","#2E8B6F","#7A5C61","#4B5563"];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = s => document.querySelector(s);
  const X = c => G.PADX + c * G.COL;

  function rnd() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
    catch (e) { return Math.random(); }
  }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  function fresh(names) {
    const rungs = [];
    for (let l = 0; l < L; l++) {
      const row = [];
      for (let i = 0; i < N - 1; i++) { if (rnd() < 0.5) { row.push(i); i++; } }
      rungs.push(row);
    }
    return {
      names: names || Array.from({ length: N }, (_, i) => String(i + 1)),
      rungs,
      jit: Array.from({ length: L }, () => Math.round((rnd() - 0.5) * 10)),
      slots: shuffle(["bye","bye","bye","bye","bye","m1","m1","m2","m2","m3","m3"]),
      revealed: Array(N).fill(false),
      order: []
    };
  }
  function valid(j) {
    try {
      if (!j || j.names.length !== N || j.rungs.length !== L || j.jit.length !== L || j.slots.length !== N || j.revealed.length !== N || !Array.isArray(j.order)) return false;
      if (!j.rungs.every(r => Array.isArray(r) && r.every(v => Number.isInteger(v) && v >= 0 && v < N - 1 && !r.includes(v + 1)))) return false;
      const cnt = {}; j.slots.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
      return cnt.bye === 5 && cnt.m1 === 2 && cnt.m2 === 2 && cnt.m3 === 2;
    } catch (e) { return false; }
  }
  function load() { try { const j = JSON.parse(localStorage.getItem(STORE)); if (valid(j)) return j; } catch (e) {} return null; }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

  let S = load() || fresh();
  let busy = false;

  const nm = i => (S.names[i] || "").trim() || String(i + 1);
  const short = n => { const a = Array.from(n); return a.length > 5 ? a.slice(0, 5).join("") + "…" : n; };
  const yOf = l => G.TOP + (l + 0.5) * G.STEP + S.jit[l];

  function route(start) {
    let c = start; const pts = [[X(c), G.TOP]];
    for (let l = 0; l < L; l++) {
      const r = S.rungs[l], y = yOf(l); let nc = c;
      if (r.includes(c)) nc = c + 1; else if (r.includes(c - 1)) nc = c - 1;
      if (nc !== c) { pts.push([X(c), y], [X(nc), y]); c = nc; }
    }
    pts.push([X(c), G.TOP + G.LAD_H]);
    return { pts, end: c };
  }
  const dOf = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");

  function renderLadder() {
    const svg = $("#lad");
    svg.setAttribute("viewBox", "0 0 " + G.W + " " + G.H);
    const R = Array.from({ length: N }, (_, i) => route(i));
    const top = G.TOP, bot = G.TOP + G.LAD_H;
    let s = "";
    for (let c = 0; c < N; c++) s += `<line class="rail" x1="${X(c)}" y1="${top}" x2="${X(c)}" y2="${bot}"/>`;
    S.rungs.forEach((r, l) => { const y = yOf(l); r.forEach(i => { s += `<line class="rung" x1="${X(i)}" y1="${y.toFixed(1)}" x2="${X(i + 1)}" y2="${y.toFixed(1)}"/>`; }); });
    S.order.forEach(i => { s += `<path class="trace" style="stroke:${COLORS[i]}" d="${dOf(R[i].pts)}"/>`; });
    s += `<circle id="dot" r="${G.compact ? 6 : 8}" display="none"/>`;
    for (let i = 0; i < N; i++) {
      const done = S.revealed[i];
      s += `<g class="team${done ? " done" : ""}" data-i="${i}" tabindex="${done ? -1 : 0}" role="button" aria-label="${esc(nm(i))} 사다리 타기${done ? " (완료)" : ""}" style="--c:${COLORS[i]}">` +
           `<title>${esc(nm(i))}</title><rect class="hit" x="${X(i) - G.COL / 2}" y="0" width="${G.COL}" height="${top}"/>` +
           `<circle cx="${X(i)}" cy="${G.CY}" r="${G.R}"/><text class="num" x="${X(i)}" y="${G.CY}" style="font-size:${G.NUMFS}px">${i + 1}</text>` +
           (G.compact ? "" : `<text class="nm" x="${X(i)}" y="${G.CY + 40}">${esc(short(nm(i)))}</text>`) + `</g>`;
    }
    const sy = bot + G.GAP, SPLIT = { bye: ["부전", "승"], m1: ["시합", "1"], m2: ["시합", "2"], m3: ["시합", "3"] };
    for (let c = 0; c < N; c++) {
      const who = S.order.find(i => R[i].end === c), done = who !== undefined, lab = S.slots[c], x = X(c), cy = sy + G.SH / 2;
      let label;
      if (!done) label = `<text x="${x}" y="${cy}" style="font-size:${G.compact ? 14 : 16}px">?</text>`;
      else if (G.compact) label = `<text x="${x}" y="${cy - 7}" style="font-size:11px"><tspan x="${x}">${SPLIT[lab][0]}</tspan><tspan x="${x}" dy="14">${SPLIT[lab][1]}</tspan></text>`;
      else label = `<text x="${x}" y="${cy}">${LABELS[lab]}</text>`;
      const whoTxt = !done ? "" : G.compact
        ? `<text class="who" x="${x}" y="${sy + G.SH + 17}" style="font-size:12px;fill:${COLORS[who]}">${who + 1}</text>`
        : `<text class="who" x="${x}" y="${sy + G.SH + 20}">${esc(short(nm(who)))}</text>`;
      s += `<g class="slot${done ? " done" : ""}" data-c="${c}" style="--c:${LC[lab]}">` +
           `<rect x="${x - G.SW / 2}" y="${sy}" width="${G.SW}" height="${G.SH}" rx="${G.compact ? 9 : 13}"/>${label}${whoTxt}</g>`;
    }
    svg.innerHTML = s;
    renderMap();
  }

  function renderMap() {
    const el = $("#teamMap");
    const custom = S.names.some((n, i) => (n || "").trim() && n.trim() !== String(i + 1));
    if (!G.compact || !custom) { el.innerHTML = ""; return; }
    el.innerHTML = Array.from({ length: N }, (_, i) => `<span><b style="color:${COLORS[i]}">${i + 1}</b> ${esc(nm(i))}</span>`).join("");
  }

  function chip(i) { return `<span class="chip" style="--t:${COLORS[i]}"><i></i>${esc(nm(i))}</span>`; }
  const empty = `<span class="chip empty">?</span>`;
  function groups() {
    const g = { bye: [], m1: [], m2: [], m3: [] };
    S.order.forEach(i => g[S.slots[route(i).end]].push(i));
    return g;
  }
  function renderBoard() {
    const g = groups();
    let h = "";
    ["bye", "m1", "m2", "m3"].forEach(k => {
      const cap = k === "bye" ? 5 : 2, list = g[k];
      let li = "";
      for (let n = 0; n < cap; n++) {
        li += `<li>${list[n] !== undefined ? chip(list[n]) : empty}</li>`;
        if (k !== "bye" && n === 0) li += `<li class="vs" aria-hidden="true">VS</li>`;
      }
      h += `<article class="card res${k === "bye" ? "" : " match"}" style="--c:${LC[k]}"><header><h3>${LABELS[k]}</h3><span>${k === "bye" ? "다음 라운드 직행" : "2팀 맞대결"}</span></header><ul>${li}</ul></article>`;
    });
    $("#board").innerHTML = h;
    $("#prog").textContent = S.order.length + " / " + N + "팀 공개";
    $("#doneMsg").textContent = S.order.length === N ? "모든 팀의 결과가 정해졌습니다. 🎉" : "";
  }
  function render() { renderLadder(); renderBoard(); }

  function run(i) {
    if (busy || S.revealed[i]) return;
    busy = true;
    const r = route(i), svg = $("#lad");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", dOf(r.pts)); p.setAttribute("class", "trace"); p.style.stroke = COLORS[i];
    svg.insertBefore(p, $("#dot"));
    const len = p.getTotalLength(), dot = $("#dot");
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    dot.setAttribute("fill", COLORS[i]); dot.removeAttribute("display");
    const dur = reduce ? 0 : Math.max(1600, Math.min(3400, len * 2.2)), t0 = performance.now();
    function finish() {
      S.revealed[i] = true; S.order.push(i); save(); busy = false; render();
      const el = document.querySelector('.slot[data-c="' + r.end + '"]'); if (el) el.classList.add("pop");
    }
    (function step(now) {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1, e = -(Math.cos(Math.PI * t) - 1) / 2;
      p.style.strokeDashoffset = len * (1 - e);
      const pt = p.getPointAtLength(len * e); dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
      if (t < 1) requestAnimationFrame(step); else finish();
    })(t0);
  }

  $("#lad").addEventListener("click", e => { const g = e.target.closest(".team"); if (g) run(+g.dataset.i); });
  $("#lad").addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest && e.target.closest(".team"); if (g) { e.preventDefault(); run(+g.dataset.i); }
  });

  $("#all").addEventListener("click", () => {
    if (busy) return;
    for (let i = 0; i < N; i++) if (!S.revealed[i]) { S.revealed[i] = true; S.order.push(i); }
    save(); render();
  });
  $("#reset").addEventListener("click", () => {
    if (busy) return;
    if (S.order.length && !confirm("지금까지의 결과가 모두 사라집니다.\n새 사다리를 만들까요?")) return;
    S = fresh(S.names); save(); render();
  });
  let tt;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }
  $("#copy").addEventListener("click", () => {
    const g = groups(), nameOf = i => nm(i);
    const line = (k, cap) => { const a = g[k].map(nameOf); while (a.length < cap) a.push("미정"); return LABELS[k] + ": " + (k === "bye" ? a.join(", ") : a.join(" vs ")); };
    const txt = "사다리 타기 결과\n\n" + line("bye", 5) + "\n" + line("m1", 2) + "\n" + line("m2", 2) + "\n" + line("m3", 2);
    const ok = () => toast("결과를 복사했습니다");
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? ok() : toast("복사하지 못했습니다"); } catch (e) { toast("복사하지 못했습니다"); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });

  (function buildNames() {
    let h = "";
    for (let i = 0; i < N; i++) h += `<label>${i + 1}<input type="text" maxlength="10" data-i="${i}" value="${esc(S.names[i])}" placeholder="${i + 1}" aria-label="${i + 1}번 팀 이름"></label>`;
    $("#nameGrid").innerHTML = h;
    $("#nameGrid").addEventListener("input", e => {
      const el = e.target; if (!el.matches("input")) return;
      S.names[+el.dataset.i] = el.value; save(); if (!busy) render();
    });
  })();

  let rsz;
  window.addEventListener("resize", () => {
    clearTimeout(rsz);
    rsz = setTimeout(() => {
      if (busy) return;
      const before = G.compact + "|" + G.COL;
      setGeo();
      if (before !== G.compact + "|" + G.COL) render();
    }, 120);
  });

  setGeo();
  render();
})();
</script>
</body>
</html>
