<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5분 말씀 묵상</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5분 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
<style>
.month-card-row { display:flex; gap:14px; padding: 8px 40px 36px; }
.month-card {
  flex:1; text-decoration:none; aspect-ratio: 3/4; display:block;
}
.month-card-inner {
  background: var(--charcoal);
  border-radius: 6px; height:100%; box-sizing:border-box;
  padding: 26px 20px; display:flex; flex-direction:column; justify-content:space-between;
  position:relative; overflow:hidden;
  box-shadow: 0 10px 28px rgba(0,0,0,0.22);
  transition: transform 0.22s ease, box-shadow 0.22s ease;
  border: 1px solid rgba(168,197,206,0.15);
}
.month-card:hover .month-card-inner {
  transform: translateY(-5px);
  box-shadow: 0 16px 36px rgba(0,0,0,0.3);
}
.month-card-wm {
  position:absolute; top:-8px; left:-6px;
  font-family:'Noto Serif KR', serif; font-weight:900; font-size:98px; color:rgba(255,255,255,0.045);
  line-height:1; letter-spacing:-3px; white-space:nowrap; z-index:0;
}
.month-card-top { position:relative; z-index:1; }
.month-card-year {
  font-size:12px; font-weight:700; letter-spacing:3px; color:var(--steel); text-transform:uppercase;
}
.month-card-num {
  font-family:'Noto Serif KR', serif; color:var(--white); font-size:42px; font-weight:700;
  line-height:1; margin-top:10px; letter-spacing:-1px;
}
.month-card-divider { width:22px; height:1px; background:var(--steel); opacity:0.6; margin-top:14px; }
.month-card-bottom { position:relative; z-index:1; }
.month-card-range {
  font-size:14px; font-weight:400; color:rgba(255,255,255,0.55); line-height:1.7;
  font-family:'Noto Serif KR', serif; font-style:italic;
}
.month-card-cta {
  font-size:14px; font-weight:700; color:var(--steel); letter-spacing:1px; margin-top:14px;
  display:flex; align-items:center; gap:4px;
}
</style>
</head>
<body>

<div class="fs-control" id="fs-control">
  <span class="fs-label">글씨 크기</span>
  <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
  <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
  <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
  <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
</div>

<div class="card">
  <div class="hero">
    <div class="ghost-wm">ROMANS</div>
    <div class="hero-inner">
      <div class="eyebrow-row">
        <div class="eyebrow-line"></div>
        <div class="eyebrow">Daily Bible Meditation</div>
      </div>
      <div class="hero-title">5분 말씀 묵상</div>
      <div class="hero-sub">대전성은교회 청년부 · 로마서</div>

      <div class="hero-verse">
        "주의 말씀은 내 발에 등이요 내 길에 빛이니이다"
        <span class="hero-verse-ref">&mdash; 시편 119:105</span>
      </div>
    </div>
  </div>

  <div class="page-label">Contents &middot; 목차</div>

  <div id="month-grid-container" class="month-card-row"></div>

  <div class="footer-legal">
    <p>말씀과 함께 하루를</p>
    <p>대전성은교회 청년부 · 5분 말씀 묵상 시리즈</p>
  </div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>&uarr;</span></button>

<script src="js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('month-grid-container');
  let posts;
  try {
    posts = await loadPosts('data/posts.json');
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;&#65039;</div><div class="empty-text">목록을 불러오지 못했습니다.</div></div>';
    return;
  }

  const monthKeys = [...new Set(posts.map(p => `${p.year}-${String(p.month).padStart(2,'0')}`))].sort();

  let html = '';
  monthKeys.forEach((key) => {
    const [y, m] = key.split('-');
    const monthPosts = posts.filter(p => `${p.year}-${String(p.month).padStart(2,'0')}` === key)
                             .sort((a,b) => a.day - b.day);
    const first = monthPosts[0];
    const last = monthPosts[monthPosts.length - 1];
    const startChapVerse = first.ref.split(/[\u2013-]/)[0];
    const endChapVerse = `${last.ref.split(':')[0]}:${last.ref.split(/[\u2013-]/).pop()}`;

    html += `
      <a href="archive.html?month=${key}" class="month-card">
        <div class="month-card-inner">
          <div class="month-card-wm">${parseInt(m)}</div>
          <div class="month-card-top">
            <div class="month-card-year">${y}</div>
            <div class="month-card-num">${parseInt(m)}월</div>
            <div class="month-card-divider"></div>
          </div>
          <div class="month-card-bottom">
            <div class="month-card-range">로마서<br>${startChapVerse} ~ ${endChapVerse}</div>
            <div class="month-card-cta">보러가기 &rarr;</div>
          </div>
        </div>
      </a>`;
  });
  container.innerHTML = html;
}
init();
</script>
</body>
</html>
