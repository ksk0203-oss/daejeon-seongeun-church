<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘의 묵상 · 5분 말씀 묵상</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5분 묵상">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="fs-control" id="fs-control">
  <span class="fs-label">글씨 크기</span>
  <button class="fs-btn" data-scale="0.9" onclick="setFontScale(0.9)">가</button>
  <button class="fs-btn fs-active" data-scale="1" onclick="setFontScale(1)">가</button>
  <button class="fs-btn" data-scale="1.15" onclick="setFontScale(1.15)">가</button>
  <button class="fs-btn" data-scale="1.3" onclick="setFontScale(1.3)">가</button>
</div>

<div class="card">
  <div class="back-row">
    <button class="back-btn" onclick="location.href='../archive.html'">&larr; 전체 목록으로</button>
  </div>

  <div id="content-container">
    <div class="empty-state"><div class="empty-icon">&#9203;</div><div class="empty-text">불러오는 중입니다...</div></div>
  </div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="맨 위로"><span>&uarr;</span></button>

<script src="../js/app.js"></script>
<script>
async function init() {
  const container = document.getElementById('content-container');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128269;</div><div class="empty-text">잘못된 주소입니다.<br>목록에서 다시 선택해주세요.</div></div>';
    return;
  }

  let posts;
  try {
    posts = await loadPosts('../data/posts.json');
  } catch (e) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;&#65039;</div><div class="empty-text">내용을 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div></div>';
    return;
  }

  const post = posts.find(p => p.id === id);
  if (!post || !post.ready) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128679;</div><div class="empty-text">아직 준비중인 날짜입니다.</div></div>';
    return;
  }

  document.title = post.theme + ' · 5분 말씀 묵상';
  currentPost = post;

  const readyPosts = posts.filter(p => p.ready);
  const idx = readyPosts.findIndex(p => p.id === id);
  const next = readyPosts[idx + 1];

  container.innerHTML = `
    <div class="page-label" style="padding-top:24px; color:var(--steel);">Daily Bible Meditation</div>
    <div class="chapter-label" style="padding-top:10px;">
      <div class="chapter-num">${String(post.day).padStart(2,'0')}</div>
      <div class="chapter-date">${post.month}월 ${post.day}일 &middot; 로마서 ${post.ref}</div>
    </div>

    <div class="audio-row">
      <button class="audio-play-btn" id="audio-play-btn" onclick="togglePlay()">
        <span id="audio-play-icon">&#9654;</span>
      </button>
      <div class="audio-status" id="audio-status">듣기</div>
      <div class="audio-speed-group">
        <button class="speed-btn is-active" data-rate="1" onclick="setRate(1)">1x</button>
        <button class="speed-btn" data-rate="1.25" onclick="setRate(1.25)">1.25x</button>
        <button class="speed-btn" data-rate="1.5" onclick="setRate(1.5)">1.5x</button>
      </div>
    </div>

    <div class="content-section" style="padding-top:16px;">
      <h2 class="section-title">${post.theme}</h2>
      <div class="scripture-box">${post.scripture}</div>

      <div class="section-block">
        <span class="section-label">묵상</span>
        <p class="section-text">${post.meditation}</p>
      </div>

      <div class="section-block">
        <span class="section-label">적용</span>
        <p class="section-text">${post.application}</p>
      </div>

      <div class="divider" style="margin-left:0; margin-right:0;"></div>

      <div class="section-block" style="margin-bottom:0;">
        <span class="section-label">기도</span>
        <p class="section-text">${post.prayer}</p>
      </div>
    </div>

    <div class="footer-legal">
      <p>말씀과 함께 하루를</p>
      <p>대전성은교회 청년부 · 5분 말씀 묵상 시리즈</p>
    </div>
    <div class="footer-links">
      <a href="../archive.html">${next ? `다음: ${next.date_label}` : '전체 목록으로'}</a>
    </div>
  `;
}
init();
</script>
</body>
</html>
